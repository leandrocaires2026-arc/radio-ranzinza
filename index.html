<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rádio Ranzinza</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }

        /* ---------------------------------------------------------
           1. ESTILO PADRÃO / DESKTOP (Computador fica exatamente como está)
           --------------------------------------------------------- */
        .app-container {
            width: 90vw;
            max-width: 900px;
            height: 90vh;
            background: #0b0b12;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            position: relative;
        }

        .video-box {
            width: 100%;
            flex-grow: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantém o vídeo inteiro no desktop */
        }

        header h1 {
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
        }

        footer {
            text-align: center;
            font-size: 1rem;
            opacity: 0.8;
        }


        /* ---------------------------------------------------------
           2. REGRAS PARA SMARTPHONE (Apenas telas menores que 768px)
           --------------------------------------------------------- */
        @media (max-width: 767px) {
            body {
                padding: 0;
                align-items: center;
            }

            /* No celular em pé (Retrato): Força 9:16 */
            .app-container {
                width: 100%;
                height: 100vh;
                max-width: 450px;
                max-height: 800px;
                aspect-ratio: 9 / 16; /* Trava em 9:16 */
                border: 2px solid #00ffcc;
                border-radius: 0;
                padding: 15px;
                box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            }

            .video-box video {
                object-fit: cover; /* Preenche a tela vertical no celular */
            }

            header h1 {
                font-size: 1.2rem;
            }
        }


        /* ---------------------------------------------------------
           3. QUANDO O CELULAR É VIRADO NA HORIZONTAL (Landscape)
           --------------------------------------------------------- */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                padding: 0;
            }
            
            .app-container {
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
                aspect-ratio: unset; /* Remove qualquer proporção fixa */
                border: none;
                border-radius: 0;
                box-shadow: none;
                padding: 10px;
            }

            .video-box {
                max-height: calc(100vh - 80px);
            }

            .video-box video {
                object-fit: contain; /* Adapta para a tela deitada do celular */
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Topo da Rádio -->
        <header>
            <h1>RÁDIO RANZINZA</h1>
        </header>

        <!-- Player de Vídeo -->
        <div class="video-box">
            <video autoplay muted loop playsinline>
                <source src="seu-video-programacao.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </div>

        <!-- Rodapé -->
        <footer>
            <p>Transmitindo ao vivo...</p>
        </footer>
    </div>

</body>
</html>
