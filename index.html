<script>
    function criarMarcacoesRelogio(faceId) {
        const face = document.getElementById(faceId);
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.className = i % 5 === 0 ? 'tick major' : 'tick';
            tick.style.transform = `translate(60px, 60px) rotate(${i * 6}deg) translate(0, -48px)`;
            face.appendChild(tick);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        criarMarcacoesRelogio('faceUTC');
        criarMarcacoesRelogio('faceUptime');
        iniciarMotorRadioSequencial();
    });

    function abrirModalPartilha() {
        const urlAtual = encodeURIComponent(window.location.href);
        const textoMensagem = encodeURIComponent("Ouça a Rádio Ranzinza, uma nova conexão para o futuro a 432Hz!");

        document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${textoMensagem}%20${urlAtual}`;
        document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${urlAtual}`;
        document.getElementById('shareThreads').href = `https://threads.net/intent/post?text=${textoMensagem}%20${urlAtual}`;

        document.getElementById('shareModal').style.display = 'flex';
    }

    function partilharNativoRedes() {
        const urlAtual = window.location.href;
        if (navigator.share) {
            navigator.share({
                title: 'Rádio Ranzinza',
                text: 'Ouça a Rádio Ranzinza, uma nova conexão para o futuro a 432Hz!',
                url: urlAtual,
            }).then(() => {
                fecharModalPartilha();
            }).catch((error) => console.log('Partilha cancelada', error));
        } else {
            copiarLinkRadio();
        }
    }

    function fecharModalPartilha() {
        document.getElementById('shareModal').style.display = 'none';
    }

    function copiarLinkRadio() {
        const urlAtual = window.location.href;
        navigator.clipboard.writeText(urlAtual).then(() => {
            alert('Link da Rádio Ranzinza copiado para a área de transferência!');
            fecharModalPartilha();
        }).catch(err => {
            console.error('Erro ao copiar link: ', err);
        });
    }

    /* Montagem da grade unificada com jingle a cada 3 músicas */
    const itemProgramacao = [];
    let contadorMusicas = 0;

    playlistNewAge.forEach((faixa) => {
        itemProgramacao.push({ type: 'music', ...faixa });
        contadorMusicas++;
        if (contadorMusicas % 3 === 0) {
            itemProgramacao.push({ type: 'jingle', title: '🎙️ [JINGLE] Rádio Ranzinza', duration: 7 });
        }
    });

    playlistCicloResto.forEach((faixa) => {
        itemProgramacao.push({ type: 'music', ...faixa });
        contadorMusicas++;
        if (contadorMusicas % 3 === 0) {
            itemProgramacao.push({ type: 'jingle', title: '🎙️ [JINGLE] Rádio Ranzinza', duration: 7 });
        }
    });

    const audio1 = document.getElementById('audioPlayer1');
    const audio2 = document.getElementById('audioPlayer2');
    const nowPlayingText = document.getElementById('now-playing');
    
    let indiceAtual = 0;
    let playerAtivo = 1;
    let executandoJingleVoz = false;

    function iniciarMotorRadioSequencial() {
        // Relógios visuais
        setInterval(() => {
            const agora = new Date();
            const hUTC = agora.getUTCHours();
            const mUTC = agora.getUTCMinutes();
            const sUTC = agora.getUTCSeconds();
            
            document.getElementById('utcSec').style.transform = `translateX(-50%) rotate(${sUTC * 6}deg)`;
            document.getElementById('utcMin').style.transform = `translateX(-50%) rotate(${mUTC * 6 + sUTC * 0.1}deg)`;
            document.getElementById('utcHour').style.transform = `translateX(-50%) rotate(${(hUTC % 12) * 30 + mUTC * 0.5}deg)`;
            document.getElementById('utcDigital').innerText = `${String(hUTC).padStart(2,'0')}:${String(mUTC).padStart(2,'0')}:${String(sUTC).padStart(2,'0')}`;
        }, 1000);

        // Inicia a primeira faixa/item
        tocarItemAtual();
    }

    function falarJingleNarrador() {
        if ('speechSynthesis' in window && !executandoJingleVoz) {
            executandoJingleVoz = true;
            window.speechSynthesis.cancel();
            const frase = new SpeechSynthesisUtterance("Rádio Ranzinza, uma nova conexão para o futuro!");
            frase.lang = 'pt-BR';
            frase.rate = 1.05;
            frase.pitch = 0.95;
            frase.onend = () => { executandoJingleVoz = false; };
            frase.onerror = () => { executandoJingleVoz = false; };
            window.speechSynthesis.speak(frase);
        }
    }

    function tocarItemAtual() {
        const item = itemProgramacao[indiceAtual];
        const activeAudio = playerAtivo === 1 ? audio1 : audio2;
        const nextAudio = playerAtivo === 1 ? audio2 : audio1;

        if (item.type === 'jingle') {
            nowPlayingText.innerHTML = `No ar agora: <strong style="color: var(--neon-pink);">${item.title}</strong>`;
            audio1.pause();
            audio2.pause();
            falarJingleNarrador();

            // O jingle dura 7 segundos (ou o tempo da fala), depois passa para o próximo item automaticamente
            setTimeout(() => {
                avancarProximoItem();
            }, 7000);
        } else {
            nowPlayingText.innerHTML = `No ar agora: <strong>${item.title}</strong>`;
            
            nextAudio.src = item.url;
            nextAudio.volume = 1.0;
            nextAudio.load();

            nextAudio.play().then(() => {
                activeAudio.pause();
                playerAtivo = playerAtivo === 1 ? 2 : 1;
            }).catch(e => {
                console.log("Clique na página para ativar o áudio automático:", e);
            });

            // Quando a música terminar naturalmente até o último segundo, avança para a próxima
            nextAudio.onended = () => {
                avancarProximoItem();
            };
        }
    }

    function avancarProximoItem() {
        indiceAtual = (indiceAtual + 1) % itemProgramacao.length;
        tocarItemAtual();
    }

    // Carrossel de patrocínio
    setInterval(() => {
        const cards = document.querySelectorAll('.ad-slider-card');
        cards.forEach(card => {
            const slides = card.querySelectorAll('.ad-slide');
            let activeIndex = 0;
            slides.forEach((slide, index) => {
                if (slide.classList.contains('active')) activeIndex = index;
                slide.classList.remove('active');
            });
            let nextIndex = (activeIndex + 1) % slides.length;
            slides[nextIndex].classList.add('active');
            card.href = nextIndex === 0 ? "https://spotify.com" : "https://soundcloud.com";
        });
    }, 5000);

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function enviarMensagemOuvinte() {
        const input = document.getElementById('chatInput');
        const messages = document.getElementById('chatMessages');
        if(input.value.trim() !== '') {
            const p = document.createElement('p');
            p.innerHTML = `<strong style="color: var(--neon-blue);">Ouvinte:</strong> ${input.value}`;
            messages.appendChild(p);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function enviarMensagemAdmin() {
        const input = document.getElementById('adminInput');
        const messages = document.getElementById('chatMessages');
        if(input.value.trim() !== '') {
            const p = document.createElement('p');
            p.innerHTML = `<strong style="color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,0,127,0.6);">📻 Rádio Ranzinza (Estúdio):</strong> ${input.value}`;
            messages.appendChild(p);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }
    }
</script>
