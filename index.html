<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Ranzinza // Cyber Studio</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #15151a;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* NOVO CABEÇALHO COM MOLDURA CYBERPUNK DO RECORTE */
        header {
            width: 100%;
            max-width: 1200px;
            height: 200px; /* Mesma altura do banner antigo */
            margin-bottom: 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }
        .header-svg {
            width: 100%;
            height: 100%;
        }
        /* Animação suave para o letreiro pulsar */
        @keyframes letreiroPulse {
            0%, 100% { fill: #00f0ff; opacity: 1; filter: drop-shadow(0 0 5px #00f0ff); }
            50% { fill: #ffffff; opacity: 0.9; filter: drop-shadow(0 0 10px #00f0ff); }
        }
        .text-pulse {
            animation: letreiroPulse 4s infinite ease-in-out;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            z-index: 10;
        }
        .schedule-title p strong {
            color: #00f0ff !important;
        }
        /* FIM DO NOVO CABEÇALHO */

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        @media (max-width: 950px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
        }
        .card-top {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .card-bottom {
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        h3 {
            margin-top: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .side-panel, .center-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .column-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .player-box {
