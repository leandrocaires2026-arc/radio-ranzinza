    function criarMarcacoesRelogio(faceId) {
        const face = document.getElementById(faceId);
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.className = i % 5 === 0 ? 'tick major' : 'tick';
            tick.style.transform = `translate(60px, 60px) rotate(${i * 6}deg) translate(0, -48px)`;
            face.appendChild(tick);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        criarMarcacoesRelogio('faceUTC');
        criarMarcacoesRelogio('faceUptime');

    });

    /* FUNÇÕES DO MODAL DE PARTILHA */
    function abrirModalPartilha() {
        const urlAtual = encodeURIComponent(window.location.href);
        const textoMensagem = encodeURIComponent("Ouça a Rádio Ranzinza, uma nova conexão para o futuro a 432Hz!");

        document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${textoMensagem}%20${urlAtual}`;
        document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${urlAtual}`;
        document.getElementById('shareThreads').href = `https://threads.net/intent/post?text=${textoMensagem}%20${urlAtual}`;

        document.getElementById('shareModal').style.display = 'flex';
    }

    function partilharNativoRedes() {
        const urlAtual = window.location.href;
        if (navigator.share) {
            navigator.share({
                title: 'Rádio Ranzinza',
                text: 'Ouça a Rádio Ranzinza, uma nova conexão para o futuro a 432Hz!',
                url: urlAtual,
            }).then(() => {
                fecharModalPartilha();
            }).catch((error) => console.log('Partilha cancelada', error));
        } else {
            copiarLinkRadio();
        }
    }

    function fecharModalPartilha() {
        document.getElementById('shareModal').style.display = 'none';
    }

    function copiarLinkRadio() {
        const urlAtual = window.location.href;
        navigator.clipboard.writeText(urlAtual).then(() => {
            alert('Link da Rádio Ranzinza copiado para a área de transferência!');
            fecharModalPartilha();
        }).catch(err => {
            console.error('Erro ao copiar link: ', err);
        });
    }

    const DURACAO_JINGLE = 7;
    const itemProgramacao = [];
    let contadorMusicas = 0;

    playlistNewAge.forEach((faixa) => {
        itemProgramacao.push({ type: 'music', ...faixa });
        contadorMusicas++;
        if (contadorMusicas % 3 === 0) {
            itemProgramacao.push({ type: 'jingle', title: '🎙️ [JINGLE] Rádio Ranzinza', duration: DURACAO_JINGLE });
        }
    });

    const duracaoBlocoNewAge = itemProgramacao.reduce((total, item) => total + item.duration, 0);

    playlistCicloResto.forEach((faixa) => {
        itemProgramacao.push({ type: 'music', ...faixa });
        contadorMusicas++;
        if (contadorMusicas % 3 === 0) {
            itemProgramacao.push({ type: 'jingle', title: '🎙️ [JINGLE] Rádio Ranzinza', duration: DURACAO_JINGLE });
        }
    });

    const duracaoTotalGrade = itemProgramacao.reduce((total, item) => total + item.duration, 0);

    const audio1 = document.getElementById('audioPlayer1');
    const audio2 = document.getElementById('audioPlayer2');
    const nowPlayingText = document.getElementById('now-playing');
    
    const tempoInicioEmissao = Date.now() - (12 * 3600 * 1000);
    let playerAtivo = 1;
    let itemAtualIndex = -1;
    let executandoJingleVoz = false;
    let emTransicao = false;
    let synthTimeout = null;
    let primeiraSincronizacaoFeita = false;

    function iniciarMotorRadioGlobal() {
        setInterval(() => {
            const agora = new Date();
            const hUTC = agora.getUTCHours();
            const mUTC = agora.getUTCMinutes();
            const sUTC = agora.getUTCSeconds();
            
            document.getElementById('utcSec').style.transform = `translateX(-50%) rotate(${sUTC * 6}deg)`;
            document.getElementById('utcMin').style.transform = `translateX(-50%) rotate(${mUTC * 6 + sUTC * 0.1}deg)`;
            document.getElementById('utcHour').style.transform = `translateX(-50%) rotate(${(hUTC % 12) * 30 + mUTC * 0.5}deg)`;
            document.getElementById('utcDigital').innerText = `${String(hUTC).padStart(2,'0')}:${String(mUTC).padStart(2,'0')}:${String(sUTC).padStart(2,'0')}`;

            const diffMs = Date.now() - tempoInicioEmissao;
            const totalSecs = Math.floor(diffMs / 1000);
            const upH = Math.floor(totalSecs / 3600);
            const upM = Math.floor((totalSecs % 3600) / 60);
            const upS = totalSecs % 60;

            document.getElementById('upSec').style.transform = `translateX(-50%) rotate(${upS * 6}deg)`;
            document.getElementById('upMin').style.transform = `translateX(-50%) rotate(${upM * 6 + upS * 0.1}deg)`;
            document.getElementById('upHour').style.transform = `translateX(-50%) rotate(${(upH % 12) * 30 + upM * 0.5}deg)`;
            document.getElementById('uptimeDigital').innerText = `${String(upH).padStart(2,'0')}:${String(upM).padStart(2,'0')}:${String(upS).padStart(2,'0')}`;
        }, 1000);

        sincronizarTransmissaoEstrita();
        setInterval(sincronizarTransmissaoEstrita, 1000);
    }

    function calcularPontoGlobalUTC() {
        const agora = new Date();
        const segundosUTC = (agora.getUTCHours() * 3600) + (agora.getUTCMinutes() * 60) + agora.getUTCSeconds();
        let segundosDesdeAs6 = segundosUTC - 21600; 
        if (segundosDesdeAs6 < 0) {
            segundosDesdeAs6 += 86400; 
        }

        let tempoNoCiclo = 0;
        if (segundosDesdeAs6 < duracaoBlocoNewAge) {
            tempoNoCiclo = segundosDesdeAs6;
        } else {
            let tempoAposManha = segundosDesdeAs6 - duracaoBlocoNewAge;
            let duracaoResto = duracaoTotalGrade - duracaoBlocoNewAge;
            tempoNoCiclo = duracaoBlocoNewAge + (tempoAposManha % duracaoResto);
        }

        let itemIndex = 0;
        let tempoNoItem = 0;

        for (let i = 0; i < itemProgramacao.length; i++) {
            if (tempoNoCiclo < itemProgramacao[i].duration) {
                itemIndex = i;
                tempoNoItem = tempoNoCiclo;
                break;
            }
            tempoNoCiclo -= itemProgramacao[i].duration;
        }
        return { itemIndex, tempoNoItem };
    }

    function falarJingleNarrador(tempoRestanteItem) {
        if ('speechSynthesis' in window && !executandoJingleVoz) {
            executandoJingleVoz = true;
            if (synthTimeout) clearTimeout(synthTimeout);
            
            window.speechSynthesis.cancel();
            const frase = new SpeechSynthesisUtterance("Rádio Ranzinza, uma nova conexão para o futuro!");
            frase.lang = 'pt-BR';
            frase.rate = 1.05;
            frase.pitch = 0.95;
            frase.onend = () => { executandoJingleVoz = false; };
            frase.onerror = () => { executandoJingleVoz = false; };
            
            window.speechSynthesis.speak(frase);

            synthTimeout = setTimeout(() => {
                executandoJingleVoz = false;
            }, tempoRestanteItem * 1000);
        }
    }

    function sincronizarTransmissaoEstrita() {
        if (emTransicao) return;
        const ponto = calcularPontoGlobalUTC();
        const item = itemProgramacao[ponto.itemIndex];
        const activeAudio = playerAtivo === 1 ? audio1 : audio2;

        if (itemAtualIndex !== ponto.itemIndex || !primeiraSincronizacaoFeita) {
            itemAtualIndex = ponto.itemIndex;
            primeiraSincronizacaoFeita = true;

            if (item.type === 'jingle') {
                nowPlayingText.innerHTML = `No ar agora: <strong style="color: var(--neon-pink);">${item.title}</strong>`;
                audio1.pause();
                audio2.pause();
                falarJingleNarrador(item.duration - ponto.tempoNoItem);
            } else {
                nowPlayingText.innerHTML = `No ar agora (UTC): <strong>${item.title}</strong>`;
                const nextPlayer = playerAtivo === 1 ? audio2 : audio1;
                const prevPlayer = activeAudio;

                emTransicao = true;
                nextPlayer.src = item.url;
                nextPlayer.volume = 1.0; // Inicia direto com volume pleno ao atualizar/entrar
                nextPlayer.load();

                nextPlayer.onloadedmetadata = () => {
                    const pontoAtualizado = calcularPontoGlobalUTC();
                    // Alinha exatamente no segundo correto da grade sem cortes
                    nextPlayer.currentTime = Math.min(pontoAtualizado.tempoNoItem, item.duration - 0.5);
                    
                    nextPlayer.play().then(() => {
                        prevPlayer.pause();
                        playerAtivo = playerAtivo === 1 ? 2 : 1;
                        emTransicao = false;
                    }).catch(e => {
                        console.log("Aguardando interação do ouvinte:", e);
                        emTransicao = false;
                    });
                };
            }
        } else {
            // Mantém alinhado caso haja leve descompasso
            if (item.type === 'music' && !activeAudio.paused && Math.abs(activeAudio.currentTime - ponto.tempoNoItem) > 4) {
                activeAudio.currentTime = ponto.tempoNoItem;
            }
        }
    }

    setInterval(() => {
        const cards = document.querySelectorAll('.ad-slider-card');
        cards.forEach(card => {
            const slides = card.querySelectorAll('.ad-slide');
            let activeIndex = 0;
            slides.forEach((slide, index) => {
                if (slide.classList.contains('active')) activeIndex = index;
                slide.classList.remove('active');
            });
            let nextIndex = (activeIndex + 1) % slides.length;
            slides[nextIndex].classList.add('active');

            card.href = nextIndex === 0 ? "https://spotify.com" : "https://soundcloud.com";
        });
    }, 5000);

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function enviarMensagemOuvinte() {
        const input = document.getElementById('chatInput');
        const messages = document.getElementById('chatMessages');
        if(input.value.trim() !== '') {
            const p = document.createElement('p');
            p.innerHTML = `<strong style="color: var(--neon-blue);">Ouvinte:</strong> ${input.value}`;
            messages.appendChild(p);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function enviarMensagemAdmin() {
        const input = document.getElementById('adminInput');
        const messages = document.getElementById('chatMessages');
        if(input.value.trim() !== '') {
            const p.innerHTML = `<strong style="color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,0,127,0.6);">📻 Rádio Ranzinza (Estúdio):</strong> ${input.value}`;
            messages.appendChild(p);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }
    }
</script>
